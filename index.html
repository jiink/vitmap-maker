<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitmap Editor - Web</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>

<!-- TOP TOOLBAR -->
<div id="toolbar">
    <div class="toolbar-group">
        <span class="brand">VITMAP <small>WEB</small></span>
        <button data-action="save-json" title="Save JSON"><i class="fas fa-save"></i> <span class="label">Save JSON</span></button>
        <button data-action="load-json" title="Load JSON"><i class="fas fa-folder-open"></i> <span class="label">Load JSON</span></button>
        <input type="file" id="file-input" class="hidden" accept=".json,application/json">
        <button data-action="copy-script" title="Copy a ready-to-paste Lua line with this vitmap encoded as a VM1 string">
            <i class="fas fa-code"></i> <span class="label">Copy for script</span></button>
        <button data-action="import-string" title="Paste a VM1:... string (or the whole Lua line) to load it">
            <i class="fas fa-paste"></i> <span class="label">Import string</span></button>
    </div>
    <input type="text" id="project-name" aria-label="Vitmap name" placeholder="Vitmap name">
    <div class="toolbar-hint">
        Drag & Drop Image for Reference • Middle Click Pan • Scroll Zoom
    </div>
</div>

<div id="workspace">
    <!-- LEFT PANEL: TOOLS -->
    <div class="panel">
        <div class="panel-header">Tools</div>
        <div class="panel-content">
            <div class="tool-group">
                <button class="tool-btn active" id="btn-select" data-tool="select">
                    <i class="fas fa-mouse-pointer"></i> Select
                </button>
                <button class="tool-btn" id="btn-draw" data-tool="draw">
                    <i class="fas fa-pen-nib"></i> Draw
                </button>
                <button class="tool-btn" id="btn-circle" data-tool="circle">
                    <i class="fas fa-circle"></i> Circle
                </button>
            </div>
            <div class="row">
                <label for="circle-sides">Circle sides</label>
                <input type="number" id="circle-sides" min="3" max="256" step="1" value="32">
            </div>

            <div class="panel-header panel-subheader">Properties</div>

            <div class="row">
                <label>Color</label>
                <input type="color" id="color-picker" value="#00aaff">
                <input type="text" id="color-hex" value="00AAFF" aria-label="Color hex value"
                    placeholder="6D4746" maxlength="7" spellcheck="false">
            </div>
            <div class="row">
                <label for="editor-background-color">Editor background</label>
                <input type="color" id="editor-background-color" value="#121212">
            </div>
            <div class="row">
                <label>Alpha</label>
                <input type="range" id="alpha-slider" min="0" max="255" value="255">
            </div>
            <div class="row">
                <label for="border-width">Border width</label>
                <input type="number" id="border-width" min="0" step="0.1" value="0">
            </div>
            <div class="row">
                <label for="border-color">Border color</label>
                <input type="color" id="border-color" value="#ffffff">
            </div>
            <div class="row">
                <input type="checkbox" id="shape-open">
                <label for="shape-open">Open (border only)</label>
            </div>

            <div class="panel-header panel-subheader">Transform</div>
            <div id="transform-controls">
                <button data-transform="mirror-horizontal" title="Mirror horizontally" aria-label="Mirror horizontally">
                    <i class="fas fa-arrows-left-right"></i> Mirror H
                </button>
                <button data-transform="mirror-vertical" title="Mirror vertically" aria-label="Mirror vertically">
                    <i class="fas fa-arrows-up-down"></i> Mirror V
                </button>
                <button data-transform="rotate-left" title="Rotate left 45 degrees" aria-label="Rotate left 45 degrees">
                    <i class="fas fa-rotate-left"></i> Rotate Left 45°
                </button>
                <button data-transform="rotate-right" title="Rotate right 45 degrees" aria-label="Rotate right 45 degrees">
                    <i class="fas fa-rotate-right"></i> Rotate Right 45°
                </button>
                <button data-action="snap-selection" title="Snap all selected points to the nearest grid point" aria-label="Snap selection to grid">
                    <i class="fas fa-magnet"></i> Snap to Grid
                </button>
            </div>

            <div class="panel-header panel-subheader">Grid</div>

            <div class="row">
                <label>Size</label>
                <input type="number" id="grid-size" value="16">
            </div>
            <div class="row">
                <input type="checkbox" id="grid-visible" checked>
                <label for="grid-visible">Show Grid</label>
            </div>
            <div class="row">
                <input type="checkbox" id="snap-check" checked>
                <label for="snap-check">Snap to Grid</label>
            </div>
            <div class="row">
                <input type="checkbox" id="ref-check">
                <label for="ref-check">Show Scale Ref (16x16)</label>
            </div>

            <div class="panel-header panel-subheader">Overlay</div>
            <div class="row">
                <label>Opacity</label>
                <input type="range" id="overlay-opacity" min="0" max="1" step="0.1" value="0.3">
            </div>
            <div class="row">
                <label>Scale</label>
                <input type="range" id="overlay-scale" min="0.1" max="5" step="0.1" value="1">
            </div>
            <div class="row">
                <label>Pos X</label>
                <input type="range" id="overlay-x" min="-200" max="200" step="1" value="0">
            </div>
            <div class="row">
                <label>Pos Y</label>
                <input type="range" id="overlay-y" min="-200" max="200" step="1" value="0">
            </div>
            <button data-action="clear-overlay" class="full-width">Clear Overlay</button>
        </div>
    </div>

    <!-- CANVAS -->
    <div id="canvas-container">
        <canvas id="main-canvas"></canvas>
    </div>

    <!-- RIGHT PANEL: LAYERS & ANIMATIONS -->
    <div class="panel">
        <div class="panel-header">Animations (Actions)</div>
        <div class="panel-content" id="actions-panel">
            <div class="row">
                <input type="text" id="new-action-name" placeholder="Name (e.g. Run)">
                <button data-action="create-action"><i class="fas fa-plus"></i></button>
            </div>
            <div id="action-list"></div>
        </div>

        <div class="panel-header">Shapes (Current Frame)</div>
        <div class="panel-content" id="layer-list">
            <!-- Populated by JS -->
        </div>
        <div id="layer-buttons">
            <button data-action="delete-shape" title="Delete Shape"><i class="fas fa-trash"></i></button>
            <button data-action="shape-down" title="Move Down"><i class="fas fa-arrow-down"></i></button>
            <button data-action="shape-up" title="Move Up"><i class="fas fa-arrow-up"></i></button>
        </div>
    </div>
</div>

<!-- BOTTOM TIMELINE -->
<div id="timeline-area">
    <div id="timeline-controls">
        <button data-action="toggle-play"><i id="play-icon" class="fas fa-play"></i></button>
        <div class="separator"></div>
        <button data-action="add-frame"><i class="fas fa-plus-square"></i> New Frame</button>
        <button data-action="duplicate-frame"><i class="fas fa-copy"></i> Clone Frame</button>
        <button data-action="delete-frame"><i class="fas fa-trash-alt"></i> Delete Frame</button>
        <div class="spacer"></div>
        <label><input type="checkbox" id="onion-skin"> Onion Skin</label>
        <div class="separator"></div>
        <label>FPS: <input type="number" id="fps-input" value="12" min="1" max="255"></label>
    </div>
    <div id="frames-container">
        <!-- Frames injected here -->
    </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

</body>
</html>
